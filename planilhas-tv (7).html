<script>
/*LOGICA_INICIO*/
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
function pad(n){return String(n).padStart(2,'0');}
function parseNum(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  let s=String(v).trim().replace(/\s/g,'').replace(/[^\d.,\-]/g,'');
  if(!s) return null;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return isFinite(n)?n:null;
}
function serialToIso(n){const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*86400000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function parseDataIso(v){
  if(v==null||v==='') return null;
  if(v instanceof Date&&!isNaN(v)) return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate());
  if(typeof v==='number') return (v>20000&&v<80000)?serialToIso(v):null;
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1]);}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  return null;
}
function isoDias(iso){const p=iso.split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000);}
function hojeIso(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDiasIso(iso,n){const d=new Date((isoDias(iso)+n)*86400000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function fmtIso(iso){const p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]:iso;}
const ATENDIDA_OK=new Set(['TRUE','VERDADEIRO','SIM','S','X','1','OK','ATENDIDA','ATENDIDO','V','YES','Y']);
function marcado(v){
  if(v===true) return true;
  if(v==null||v===false||v==='') return false;
  if(typeof v==='number') return v!==0;
  const raw=String(v).trim();
  return ATENDIDA_OK.has(norm(raw))||['✓','✔','☑','✅'].includes(raw);
}
function lerPlanilha(buf){
  const wb=XLSX.read(buf,{type:'array'});
  return {wb,sheets:wb.SheetNames};
}
function linhasDaAba(wb,nome){
  return XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,raw:true,defval:null,blankrows:true});
}
function detectarCabecalho(rows){
  for(let i=0;i<Math.min(rows.length,30);i++){
    const n=(rows[i]||[]).filter(c=>c!=null&&String(c).trim()!=='').length;
    if(n>=3) return i+1;
  }
  return 1;
}
function montarTabela(rows,hr){
  const h=(rows[hr-1]||[]).map(x=>x==null?'':String(x).trim());
  return {headers:h,data:rows.slice(hr).filter(r=>r&&r.some(c=>c!=null&&String(c).trim()!==''))};
}
const idx=(headers,name)=>name?headers.indexOf(name):-1;
/* Casamento de termos do filtro por texto. Textos já passam por norm() (maiúsculo, sem acento).
   - Termos se separam por barra, vírgula, ponto e vírgula ou quebra de linha.
   - "iPhone 18" casa com "IPHONE 18 PRO MAX" e "IPHONE18", mas não com "IPHONE 180" nem com "IPHONE 1".
   - Só em "Só mostrar" (lista=true): "iPhone 18" também casa quando a descrição junta vários aparelhos,
     como "IPHONE 17/18/19/16", "IPHONE 17 / 18", "IPHONE 17, 18 E 19" ou "IPHONE 17 PRO/18 PRO". */
const escRe=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const MODSUF='(?:\\s+(?:PRO|MAX|PLUS|MINI|AIR|ULTRA|FE))*';
const MODELO='[A-Z]{0,2}\\d+[A-Z]?'+MODSUF;
const SEPMOD=/\s*[\/,&+-]\s*|\s+(?:E|OU)\s+/;
function termoCasa(dn,termo,lista){
  const tk=termo.split(' ').filter(Boolean);
  if(!tk.length) return false;
  if(new RegExp('(^|[^A-Z0-9])'+tk.map(escRe).join('\\s*')+'(?![A-Z0-9])').test(dn)) return true;
  const L=tk[tk.length-1];
  if(lista&&tk.length>1&&/\d/.test(L)){
    const base=tk.slice(0,-1).map(escRe).join('\\s*');
    const re=new RegExp('(?:^|[^A-Z0-9])'+base+'\\s*('+MODELO+'(?:(?:\\s*[\\/,&+-]\\s*|\\s+(?:E|OU)\\s+)'+MODELO+')*)','g');
    let m;
    while((m=re.exec(dn))){
      if(m[1].split(SEPMOD).some(x=>x.replace(/\s+(?:PRO|MAX|PLUS|MINI|AIR|ULTRA|FE)\b/g,'').trim()===L)) return true;
      if(m.index===re.lastIndex) re.lastIndex++;
    }
  }
  return false;
}
const termosDe=v=>String(v||'').split(/[,;\n\/|]/).map(norm).filter(Boolean);
const txt=(r,i)=>i>=0&&r[i]!=null?String(r[i]).trim():'';

function processEstoque(headers,data,cfg){
  const c=cfg.cols,p=cfg.params;
  const i={cod:idx(headers,c.cod),desc:idx(headers,c.desc),linha:idx(headers,c.linha),geral:idx(headers,c.geral),lojas:idx(headers,c.lojas),media:idx(headers,c.media)};
  const div=p.mediaPor==='dia'?1:(p.mediaPor==='semana'?7:30);
  const sel=new Set((cfg.linhasSel||[]).map(norm));
  const termos=termosDe;
  const F=cfg.filtros||{},G=F['*']||{};
  const gInc=termos(G.inc),gExc=termos(G.exc);
  const cacheL={};
  const filtroLinha=k=>cacheL[k]||(cacheL[k]={inc:termos((F[k]||{}).inc),exc:termos((F[k]||{}).exc)});
  const tirados=new Set((cfg.excluidos||[]).map(x=>x.k));
  const alertas=[];const st={total:0,naLinha:0,acima:0,semGiro:0,semDados:0,porFiltro:0,ocultos:0};
  data.forEach(r=>{
    st.total++;
    const linha=txt(r,i.linha);
    if(!cfg.todasLinhas&&!sel.has(norm(linha))) return;
    st.naLinha++;
    const geral=parseNum(r[i.geral]);
    if(geral==null){st.semDados++;return;}
    if(geral>p.limite){st.acima++;return;}
    const lojas=Math.max(0,parseNum(r[i.lojas])||0);
    const mediaDia=Math.max(0,(parseNum(r[i.media])||0)/div);
    if(!(mediaDia>0)){st.semGiro++;return;}
    const g=Math.max(0,geral);
    const dias=Math.floor(g/mediaDia);
    const falta=Math.max(0,Math.ceil(mediaDia*p.reposicao)-g);
    const sev=dias<=7?'crit':(dias<p.reposicao?'risco':'ok');
    let cod=txt(r,i.cod),desc=txt(r,i.desc);
    if(!cod&&desc){const sp=splitCodigo(desc);if(sp.cod&&sp.nome){cod=sp.cod;desc=sp.nome;}}
    const dn=norm(desc),fl=filtroLinha(norm(linha));
    const inc=[...gInc.length?[gInc]:[],...fl.inc.length?[fl.inc]:[]];   // cada lista precisa ser atendida (E entre listas, OU dentro da lista)
    if(inc.some(l=>!l.some(t=>termoCasa(dn,t,true)))||[...gExc,...fl.exc].some(t=>termoCasa(dn,t,false))){st.porFiltro++;return;}
    const k=norm(cod)||dn;
    if(tirados.has(k)){st.ocultos++;return;}
    alertas.push({k,cod,desc,linha,geral:Math.round(g),lojas:Math.round(lojas),mediaDia:+mediaDia.toFixed(2),dias,falta,cobre:lojas>=falta,sev});
  });
  alertas.sort((a,b)=>a.dias-b.dias);
  return {alertas,stats:st,params:{limite:p.limite,reposicao:p.reposicao,mediaPor:p.mediaPor}};
}

const nmP=s=>norm(s).replace(/[^A-Z0-9]+/g,' ').trim();
function montarMapaPontos(txt){
  const nome=new Map(),cod=new Map(),nomes=new Map(),itens=[];
  String(txt==null?'':txt).split(/\n/).forEach(l=>{
    const m=l.match(/^\s*(\d+)\s+(.+?)\s*$/);if(!m)return;
    const ssa=norm(m[2]).includes('SALVADOR'),n=nmP(m[2]);
    nome.set(n,ssa);cod.set(m[1],ssa);nomes.set(m[1],m[2].trim());itens.push({n,ssa});
  });
  return {nome,cod,nomes,itens};
}
// devolve {ssa,listado}. 1) nome igual  2) código no começo ("394 RECIFE...")  3) nome da lista dentro do texto  4) texto "SALVADOR" (listado=false)
function tipoPonto(ponto,mapa,textoSsa){
  const n=nmP(ponto);
  if(n){
    if(mapa.nome.has(n))return {ssa:mapa.nome.get(n),listado:true};
    const mc=n.match(/^(\d+)(?:\s|$)/);
    if(mc&&mapa.cod.has(mc[1]))return {ssa:mapa.cod.get(mc[1]),listado:true};
    const pad=' '+n+' ';
    let ach=null;
    for(const it of mapa.itens){if(pad.includes(' '+it.n+' ')&&(!ach||it.n.length>ach.n.length))ach=it;}
    if(ach)return {ssa:ach.ssa,listado:true};
  }
  return {ssa:norm(ponto).includes(norm(textoSsa||'SALVADOR')),listado:false};
}
/* célula "536 Mercado Livre - Protech" -> {cod:'536', nome:'Mercado Livre - Protech'}. Sem número na frente: tudo é nome. */
function splitCodigo(v){
  const t=String(v==null?'':v).replace(/\s+/g,' ').trim();
  if(!t)return {cod:'',nome:''};
  let m=t.match(/^(\d{1,9})\s*[-–:]\s*(.+)$/)||t.match(/^(\d{1,9})\s+(.+)$/);
  if(m)return {cod:m[1],nome:m[2].trim()};
  if(/^\d{1,9}$/.test(t))return {cod:t,nome:''};
  return {cod:'',nome:t};
}
/* Colunas do ERP costumam vir em duas células: o título ("Produto") cobre a do código e a do nome, que fica na
   coluna da direita, sem cabeçalho. Se a célula tem só o número e a próxima coluna não tem título, o nome vem dela. */
function codNome(r,ci,headers){
  if(ci<0)return {cod:'',nome:''};
  const sp=splitCodigo(r[ci]);
  if(sp.cod&&!sp.nome&&ci+1<headers.length&&!String(headers[ci+1]||'').trim()){
    const nx=String(r[ci+1]==null?'':r[ci+1]).replace(/\s+/g,' ').trim();
    if(nx)sp.nome=nx;
  }
  return sp;
}
function processVendas(headers,data,cfg,hoje){
  const c=cfg.cols,p=cfg.params;hoje=hoje||hojeIso();
  const i={ref:idx(headers,c.ref),data:idx(headers,c.data),ponto:idx(headers,c.ponto),atendida:idx(headers,c.atendida),desc:idx(headers,c.desc)};
  const mapa=montarMapaPontos(cfg.pontos!=null?cfg.pontos:PONTOS_PADRAO);const naoList=new Map();
  const alertas=[];const st={total:0,atendidas:0,abertas:0,semData:0,antigas:0,longe:0,foraLista:0,naoListados:[]};
  data.forEach((r,n)=>{
    st.total++;
    const dt=parseDataIso(r[i.data]);
    if(!dt){st.semData++;return;}
    if(marcado(r[i.atendida])){st.atendidas++;return;}
    const dest=codNome(r,i.ponto,headers),prod=codNome(r,i.desc,headers);
    const ponto=dest.nome||(dest.cod&&mapa.nomes.get(dest.cod))||'',filial=dest.cod,pontoTxt=(dest.cod+' '+dest.nome).trim()||txt(r,i.ponto);
    const tp=tipoPonto(pontoTxt,mapa,p.textoSalvador),ssa=tp.ssa;     // pelo texto inteiro: código, nome ou os dois
    if(!tp.listado&&pontoTxt){st.foraLista++;naoList.set(nmP(pontoTxt),pontoTxt);}
    const prazo=ssa?p.prazoSsa:p.prazoFora,aviso=ssa?p.avisoSsa:p.avisoFora;
    const venc=addDiasIso(dt,prazo);
    const resta=isoDias(venc)-isoDias(hoje);
    st.abertas++;
    if(resta<-p.maxVencido){st.antigas++;return;}
    if(resta>aviso+15){st.longe++;return;}
    alertas.push({ref:txt(r,i.ref)||('linha '+(n+2)),cod:prod.cod,desc:prod.nome,filial,ponto,tipo:ssa?'SSA':'FORA',listado:tp.listado,data:dt,venc,aviso,resta});
  });
  st.naoListados=[...naoList.values()].slice(0,40);
  alertas.sort((a,b)=>a.resta-b.resta);
  return {alertas,stats:st};
}

        <div class="chips">${vals.map(([v,n])=>`<span class="chip ${selSet.has(norm(v))?'on':''}" onclick="toggleLinha('estoque',this.dataset.v)" data-v="${esc(v)}">${esc(v)}<i>${n}</i></span>`).join('')}</div>
        <div class="gtit" style="margin-top:18px">Filtro por texto no nome do produto (opcional)</div>
        <div class="note" style="margin:0 0 8px">Preencha só o que precisar: os dois campos são independentes e podem ficar em branco. Exemplo: na linha CAPAS, em "Só mostrar" digite <b>iPhone 18 / iPhone 17 / iPhone 16</b> (separe com barra ou vírgula) e entram só os produtos que tiverem algum desses aparelhos no nome. Produto que lista vários aparelhos, como <b>iPhone 17/18/19/16</b>, também entra. "Nunca mostrar" serve para tirar o que você não quer, como <b>13 Mini / S22</b>.</div>
        <div class="ftab">
          <div class="frow fhead"><span>Linha</span><span>Só mostrar se o nome tiver</span><span>Nunca mostrar se o nome tiver</span></div>
          ${[['*','Todas as linhas marcadas']].concat(c.linhasSel.map(v=>[norm(v),v])).map(([k,nome])=>{const f=(c.filtros||{})[k]||{};
            return `<div class="frow"><span class="fl" title="${esc(nome)}">${k==='*'?'<b>'+esc(nome)+'</b>':esc(nome)}</span>
              <input type="text" data-k="${esc(k)}" placeholder="ex.: iPhone 18 / iPhone 17 / iPhone 16" value="${esc(f.inc||'')}" oninput="setFiltro('estoque',this.dataset.k,'inc',this.value)">
              <input type="text" data-k="${esc(k)}" placeholder="ex.: 13 Mini / 12 Pro / S22" value="${esc(f.exc||'')}" oninput="setFiltro('estoque',this.dataset.k,'exc',this.value)"></div>`;}).join('')}
        </div>`
        :'<div class="note">Escolha a coluna "Linha / categoria" acima para listar as linhas.</div>'}
      </div>`;
  }
  const P=c.params;
  const params=t==='estoque'?`
    <label class="f">Alertar com estoque geral até (un)<input type="number" min="0" value="${P.limite}" oninput="setParam('estoque','limite',this.value)"></label>
    <label class="f">Próxima reposição em
      <select onchange="setParam('estoque','reposicao',this.value)"><option value="30" ${P.reposicao==30?'selected':''}>30 dias</option><option value="60" ${P.reposicao==60?'selected':''}>60 dias</option></select></label>
    <label class="f">A média de vendas da planilha é
      <select onchange="setParam('estoque','mediaPor',this.value)">
        <option value="mes" ${P.mediaPor==='mes'?'selected':''}>por mês (30 dias)</option>
        <option value="semana" ${P.mediaPor==='semana'?'selected':''}>por semana</option>
        <option value="dia" ${P.mediaPor==='dia'?'selected':''}>por dia</option></select></label>`
  :`
    <label class="f">Prazo destino de fora (dias corridos)<input type="number" min="1" value="${P.prazoFora}" oninput="setParam('vendas','prazoFora',this.value)"></label>
    <label class="f">Avisar destino de fora faltando (dias)<input type="number" min="0" value="${P.avisoFora}" oninput="setParam('vendas','avisoFora',this.value)"></label>
    <label class="f">Prazo Salvador (dias corridos)<input type="number" min="1" value="${P.prazoSsa}" oninput="setParam('vendas','prazoSsa',this.value)"></label>
    <label class="f">Avisar Salvador faltando (dias)<input type="number" min="0" value="${P.avisoSsa}" oninput="setParam('vendas','avisoSsa',this.value)"></label>
    <label class="f">Texto que identifica Salvador no destino<input type="text" value="${esc(P.textoSalvador)}" oninput="setParam('vendas','textoSalvador',this.value)"></label>
    <label class="f">Ignorar vendas vencidas há mais de (dias)<input type="number" min="0" value="${P.maxVencido}" oninput="setParam('vendas','maxVencido',this.value)"></label>`;
  document.getElementById('cfg-'+t).innerHTML=`
    <div class="card"><h2>2. Colunas que o sistema deve ler</h2>
      <div class="row" style="margin-bottom:12px">
        ${s.sheets.length>1?`<label class="f" style="min-width:220px">Aba<select onchange="setAba('${t}',this.value)">${s.sheets.map(n=>`<option ${n===s.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`:''}
        <label class="f" style="width:170px">Linha do cabeçalho<input type="number" min="1" value="${s.hr}" onchange="setHr('${t}',this.value)"></label>
        <span class="note" style="margin:18px 0 0">${s.data.length} linhas de dados</span>
      </div>
      ${campos}
      <div class="note">${t==='vendas'?'Na coluna Atendida valem: marcado (VERDADEIRO), SIM, X, 1, ✓. Vazio ou FALSO conta como não atendida.':''}</div>
    </div>
    ${linhasHtml}
    <div class="card"><h2>${t==='estoque'?'4':'3'}. Regras</h2><div class="grid">${params}</div>
            ${t==='vendas'?`<div class="gtit" style="margin-top:18px">Lista de destinos (código e nome, um por linha)</div>
        <div class="note" style="margin:4px 0 8px">Nome com <b>SALVADOR</b> = prazo de Salvador. Todo o resto = destino de fora. Funciona com o destino (ou a filial) escrito como nome, ou começando pelo código (ex.: <code>394 RECIFE RIOMAR...</code>). Destino que não estiver na lista usa o texto "${esc(P.textoSalvador)}" e aparece avisado na conferência.</div>
        <textarea spellcheck="false" style="width:100%;height:170px;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);white-space:pre;overflow:auto" oninput="setPontos(this.value)">${esc(c.pontos!=null?c.pontos:PONTOS_PADRAO)}</textarea>
        <div class="row" style="margin-top:6px;align-items:center"><span class="note" id="pontos-n" style="margin:0">${contarPontos(c.pontos!=null?c.pontos:PONTOS_PADRAO)}</span><button class="btn" onclick="restaurarPontos()">Restaurar lista original</button></div>`:''}
      <div class="note">${t==='estoque'
        ?'Dias de estoque = estoque geral ÷ média diária. Produtos sem venda na média não geram alerta. Sugestão = unidades que faltam para cobrir o prazo até a reposição.'
        :'Vencimento = data de lançamento + prazo. O alerta começa quando faltam os dias configurados e continua (como vencida) até a venda ser marcada como atendida.'}</div>
      <div class="row" style="margin-top:14px">
        <button class="btn pri" onclick="processar('${t}')">Processar e conferir</button>
        <button class="btn ok" id="pub-${t}" onclick="publicar('${t}')" disabled>Publicar na TV</button>
      </div>
      <div class="note">Depois do primeiro "Processar", a conferência se atualiza sozinha a cada mudança. A TV só muda quando você clicar em "Publicar na TV".</div>
    </div>`;
}
function validar(t,quieto){
  const s=ST[t];
  const falta=DEF[t].campos.filter(f=>f.req&&!s.cfg.cols[f.id]).map(f=>f.label);
  if(falta.length){if(!quieto)pill('Falta mapear: '+falta.join(', '),'err');return false;}
  if(t==='estoque'&&!s.cfg.todasLinhas&&!s.cfg.linhasSel.length){if(!quieto)pill('Marque ao menos uma linha','err');return false;}
  return true;
}
function processar(t){
  const s=ST[t];
  if(!s.wb){pill('Anexe o arquivo primeiro','err');return;}
  if(!validar(t))return;
  s.jaProcessou=true;
  reprocessar(t);
}
// mantém a posição da rolagem da tabela quando a conferência se atualiza
function renderRes(t){
  const box=document.getElementById('res-'+t),old=box.querySelector('.tbl'),keep=old?old.scrollTop:0;
  _renderRes(t);
  const nw=box.querySelector('.tbl');if(nw)nw.scrollTop=keep;
}
function _renderRes(t){
  const r=ST[t].res,a=r.alertas,box=document.getElementById('res-'+t);
  const nf=n=>Number(n).toLocaleString('pt-BR');
  if(t==='estoque'){
    const crit=a.filter(x=>x.sev==='crit').length;
    const oc=ST.estoque.cfg.excluidos||[];
    const ocultosHtml=oc.length?`<div class="gtit" style="margin-top:16px">Tirados da TV (${oc.length}) · clique para voltar</div>
      <div class="chips">${oc.map(x=>`<span class="chip" data-k="${esc(x.k)}" onclick="restaurarItem(this.dataset.k)" title="Voltar para a lista">↺ ${esc(x.desc||x.k)}</span>`).join('')}</div>
      <div class="row" style="margin-top:8px"><button class="btn" onclick="restaurarTodos()">Voltar todos</button></div>`:'';
    box.innerHTML=`<div class="card"><h2>Conferência</h2>
      <div class="stats">
        <div class="stat"><b>${nf(a.length)}</b>alertas</div>
        <div class="stat"><b style="color:var(--red)">${nf(crit)}</b>críticos (7 dias ou menos)</div>
        <div class="stat"><b>${nf(r.stats.naLinha)}</b>produtos nas linhas</div>
        <div class="stat"><b>${nf(r.stats.acima)}</b>acima de ${r.params.limite} un</div>
        <div class="stat"><b>${nf(r.stats.semGiro)}</b>sem venda (sem alerta)</div>
        ${r.stats.porFiltro?`<div class="stat"><b>${nf(r.stats.porFiltro)}</b>tirados pelo filtro de texto</div>`:''}
        ${r.stats.ocultos?`<div class="stat"><b>${nf(r.stats.ocultos)}</b>tirados por você (✕)</div>`:''}
        ${r.stats.semDados?`<div class="stat"><b>${nf(r.stats.semDados)}</b>sem estoque lido</div>`:''}
      </div>
      <div class="tbl"><table class="fix">
      <thead><tr><th>Situação</th><th>Produto</th><th>Linha</th><th class="n">Geral</th><th class="n">Lojas</th><th class="n">Média/dia</th><th class="n">Dias</th><th>Sugestão</th><th></th></tr></thead><tbody>
      ${a.slice(0,200).map(x=>{const sug=x.falta?`remanejar ~${nf(x.falta)} un${x.cobre?'':' (lojas não cobrem)'}`:'cobre até a reposição';
        return `<tr><td><span class="sev ${x.sev}">${x.sev==='crit'?'CRÍTICO':(x.sev==='risco'?'RISCO':'ATENÇÃO')}</span></td>
        <td title="${esc(x.desc)}">${x.cod?`<span style="font-family:'IBM Plex Mono',monospace;color:var(--dim)">${esc(x.cod)}</span> - `:''}<b style="font-weight:600">${esc(x.desc)}</b></td>
        <td title="${esc(x.linha)}">${esc(x.linha)}</td>
        <td class="n">${nf(x.geral)}</td><td class="n">${nf(x.lojas)}</td><td class="n">${nf(x.mediaDia)}</td><td class="n"><b>${nf(x.dias)}</b></td>
        <td title="${esc(sug)}">${esc(sug)}</td>
        <td class="c"><button class="xbtn" title="Tirar este item da TV" data-k="${esc(x.k)}" data-d="${esc(x.desc)}" onclick="ocultarItem(this.dataset.k,this.dataset.d)">✕</button></td></tr>`;}).join('')}
      </tbody></table></div>${ocultosHtml}${a.length>200?`<div class="note">Mostrando 200 de ${nf(a.length)}. A TV recebe todos.</div>`:''}</div>`;
  }else{
    const venc=a.filter(x=>x.resta<0).length,jan=a.filter(x=>x.resta<=x.aviso);
    box.innerHTML=`<div class="card"><h2>Conferência</h2>
      <div class="stats">
        <div class="stat"><b>${nf(r.stats.total)}</b>vendas na planilha</div>
        <div class="stat"><b>${nf(r.stats.atendidas)}</b>atendidas</div>
        <div class="stat"><b>${nf(r.stats.abertas)}</b>em aberto</div>
        <div class="stat"><b style="color:var(--amber)">${nf(jan.length)}</b>na janela de aviso</div>
        <div class="stat"><b style="color:var(--red)">${nf(venc)}</b>já vencidas</div>
        ${r.stats.semData?`<div class="stat"><b>${nf(r.stats.semData)}</b>sem data lida</div>`:''}
        ${r.stats.antigas?`<div class="stat"><b>${nf(r.stats.antigas)}</b>vencidas há muito tempo (ignoradas)</div>`:''}
        ${r.stats.foraLista?`<div class="stat"><b style="color:var(--orange)">${nf(r.stats.foraLista)}</b>em destinos fora da lista</div>`:''}
      </div>
      <div class="tbl"><table class="fix">
      <thead><tr><th>Situação</th><th>Venda</th><th>Produto</th><th>Destino</th><th>Tipo</th><th class="c">Lançada</th><th class="c">Vence</th><th class="n">Dias</th></tr></thead><tbody>
      ${jan.slice(0,300).map(x=>`<tr><td><span class="sev ${x.resta<0?'venc':'risco'}">${x.resta<0?'VENCIDA':'A VENCER'}</span></td>
        <td title="${esc(x.ref)}"><b style="font-weight:600">${esc(x.ref)}</b></td>
        <td>${x.cod?`<span style="font-family:'IBM Plex Mono',monospace;color:var(--dim)">${esc(x.cod)}</span>${x.desc?' - ':''}`:''}${esc(x.desc)}</td><td>${x.filial?`<span style="font-family:'IBM Plex Mono',monospace;color:var(--dim)">${esc(x.filial)}</span>${x.ponto?' - ':''}`:''}${esc(x.ponto)}</td>
        <td><span class="sev ${x.tipo==='SSA'?'ssa':'fora'}">${x.tipo==='SSA'?'SALVADOR':'FORA'}</span></td>
        <td class="c">${fmtIso(x.data)}</td><td class="c">${fmtIso(x.venc)}</td><td class="n"><b>${x.resta}</b></td></tr>`).join('')}
      </tbody></table></div>
      ${r.stats.naoListados&&r.stats.naoListados.length?`<div class="note" style="color:var(--orange)">Destinos que não estão na lista (classificados pelo texto "${esc(ST.vendas.cfg.params.textoSalvador)}"): ${r.stats.naoListados.map(esc).join(' · ')}</div>`:''}
      ${!ST.vendas.cfg.cols.desc?'<div class="note" style="color:var(--orange)">A coluna "Produto" não está mapeada, por isso o produto aparece vazio.</div>':''}
      <div class="note">A tabela mostra só quem já está na janela de aviso. A TV também recebe as que vão entrar nela nos próximos dias.</div></div>`;
  }
}

/* ===== Supabase ===== */
async function publicar(t){
  const s=ST[t];if(!s.res)return;
  pill('Publicando...','pend');
  const dados=t==='estoque'?{alertas:s.res.alertas,stats:s.res.stats,params:s.res.params}
    :{alertas:s.res.alertas.map(({resta,...x})=>x),stats:s.res.stats};
  const {error}=await sb.from('tv_planilhas').upsert({tipo:t,atualizado_em:new Date().toISOString(),arquivo:s.fileName,config:s.cfg,dados},{onConflict:'tipo'});
  if(error){console.error(error);pill('Erro ao publicar: '+(error.message||'?'),'err');return;}
  pill('Publicado na TV','ok');
  salvarLocal(t);mostrarUltima(t,new Date().toISOString(),s.fileName,s.res.alertas.length);
}
function mostrarUltima(t,quando,arq,n){
  const d=new Date(quando);
  const f=d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('last-'+t).innerHTML=`Última publicação: <b>${f}</b>${arq?' · '+esc(arq):''}${n!=null?' · '+n+' alerta(s)':''}`;
  document.getElementById(t==='estoque'?'tabEstoqueInfo':'tabVendasInfo').textContent='publicado '+f;
}
async function carregarPublicado(){
  try{
    const {data,error}=await sb.from('tv_planilhas').select('tipo,atualizado_em,arquivo,config,dados');
    if(error)throw error;
    (data||[]).forEach(r=>{
      if(!ST[r.tipo])return;
      if(r.config)mesclarCfg(r.tipo,r.config);
      mostrarUltima(r.tipo,r.atualizado_em,r.arquivo,r.dados&&r.dados.alertas?r.dados.alertas.length:null);
    });
  }catch(e){console.warn('carregarPublicado',e);pill('Tabela tv_planilhas não encontrada. Rode o SQL antes.','err');}
}

function aplicarTema(t){
  const b=document.getElementById('themeBtn');
  if(t==='light'){document.documentElement.setAttribute('data-theme','light');b.textContent='🌙 Fundo escuro';}
  else{document.documentElement.removeAttribute('data-theme');b.textContent='☀ Fundo branco';}
}
function trocarTema(){
  const novo=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  aplicarTema(novo);try{localStorage.setItem('planilhas_tv_tema',novo);}catch(e){}
}
try{aplicarTema(localStorage.getItem('planilhas_tv_tema')||'dark');}catch(e){aplicarTema('dark');}
['estoque','vendas'].forEach(t=>{carregarLocal(t);montarPane(t);});
carregarPublicado();
</script>
